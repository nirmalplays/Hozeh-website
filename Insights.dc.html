<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Insights — Hozeh</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;family=Roboto+Flex:opsz,wght,wdth@8..144,100..1000,25..151&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff}
body{font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:#fff;text-decoration:none}a:hover{color:#fff}
::selection{background:hsl(272 85% 62%);color:#fff}
:focus-visible{outline:2px solid hsl(272 70% 60%);outline-offset:3px}
@keyframes hzVeilA{0%,100%{transform:translate(-10%,-5%) scale(1)}50%{transform:translate(10%,8%) scale(1.25)}}
@keyframes hzVeilB{0%,100%{transform:translate(8%,6%) scale(1.1)}50%{transform:translate(-12%,-8%) scale(.9)}}
</style>
</helmet>
<dc-import name="SiteNav" active="insights" hint-size="100%,1px"></dc-import>
<main id="main">
<section aria-labelledby="ins-h" data-screen-label="Insights hero" style="position:relative;min-height:74vh;min-height:74svh;overflow:hidden;display:flex;align-items:flex-end">
<div aria-hidden="true" style="position:absolute;inset:0;opacity:.6">
<div style="position:absolute;left:10%;top:0;width:70vw;height:70vh;border-radius:50%;background:radial-gradient(closest-side, hsl(272 85% 62% / .9), transparent);animation:hzVeilA 22s ease-in-out infinite"></div>
<div style="position:absolute;right:0;top:20%;width:60vw;height:60vh;border-radius:50%;background:radial-gradient(closest-side, hsl(275 80% 22%), transparent);animation:hzVeilB 26s ease-in-out infinite"></div>
<div style="position:absolute;left:30%;top:30%;width:40vw;height:40vh;border-radius:50%;background:radial-gradient(closest-side, rgba(255,255,255,.35), transparent);animation:hzVeilB 18s ease-in-out -6s infinite"></div>
</div>
<div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(transparent 40%, #000)"></div>
<div style="position:relative;width:100%;max-width:1920px;margin:0 auto;padding:160px clamp(20px,3vw,44px) clamp(56px,8vh,96px);display:flex;flex-direction:column;gap:24px">
<span style="font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.2em;color:rgba(255,255,255,.7)">HOZEH / INSIGHTS</span>
<h1 id="ins-h" data-in="0" style="margin:0;font-size:clamp(3rem,8vw,7.5rem);font-weight:500;letter-spacing:-0.05em;line-height:.92">Ideas worth <em style="font-family:'Instrument Serif',serif;font-style:italic;font-weight:400">thinking about.</em></h1>
<p data-in=".2" style="margin:0;max-width:36rem;font-size:clamp(1.05rem,1.35vw,1.25rem);line-height:1.6;color:#D7E2EA">Thoughts on marketing, technology, growth, AI, branding, and building things differently.</p>
</div>
</section>
<section aria-label="Coming soon" style="padding:clamp(60px,8vw,110px) 0">
<div style="max-width:1920px;margin:0 auto;padding:0 clamp(20px,3vw,44px)">
<ol style="list-style:none;margin:0;padding:0;border-bottom:1px solid rgba(255,255,255,.12)">
<sc-for list="{{ posts }}" as="p" hint-placeholder-count="7">
<li data-in="0" aria-disabled="true" style="display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr) auto;gap:clamp(16px,3vw,48px);align-items:center;padding:clamp(22px,3vw,34px) 0;border-top:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.72)">
<span style="font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.2em;color:rgba(255,255,255,.4)">{{ p.n }}</span>
<span style="font-size:clamp(1.3rem,2.6vw,2.4rem);font-weight:500;letter-spacing:-0.03em">{{ p.t }}</span>
<span style="padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25);font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.6)">SOON</span>
</li>
</sc-for>
</ol>
<div style="margin-top:clamp(60px,8vw,100px);display:flex;flex-direction:column;gap:18px;align-items:flex-start">
<h2 style="margin:0;font-size:clamp(1.8rem,3vw,2.6rem);font-weight:500;letter-spacing:-0.03em">Get notified when we <em style="font-family:'Instrument Serif',serif;font-style:italic;font-weight:400">publish.</em></h2>
<sc-if value="{{ notSubscribed }}" hint-placeholder-val="{{ true }}">
<form onSubmit="{{ submit }}" style="width:100%;max-width:32rem;display:flex;gap:8px;padding:8px;border-radius:999px;background:rgba(255,255,255,.04);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 1px rgba(255,255,255,.16), inset 0 0 0 1px rgba(255,255,255,.12)">
<label for="ins-email" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Email</label>
<input id="ins-email" type="email" required="{{ true }}" placeholder="you@company.com" style="flex:1;min-width:0;height:46px;padding:0 18px;border:none;background:transparent;color:#fff;font:16px 'Geist',sans-serif;outline:none">
<button type="submit" style="height:46px;padding:0 22px;border-radius:999px;border:none;background:#fff;color:#000;font:500 15px 'Geist',sans-serif;cursor:pointer">Get notified</button>
</form>
</sc-if>
<sc-if value="{{ subscribed }}" hint-placeholder-val="{{ false }}"><p role="status" style="margin:0;padding:16px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.2);font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.2em">YOU'RE ON THE LIST.</p></sc-if>
</div>
</div>
</section>
<dc-import name="FinalCta" hint-size="100%,100svh"></dc-import>
</main>
<dc-import name="SiteFooter" hint-size="100%,640px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { sub: false };
  componentDidMount() { import(new URL('hz-fx.js', location.href).href).then(m => { if (!this._dead) this.fx = m.initFx(); }); }
  componentWillUnmount() { this._dead = true; this.fx && this.fx.cleanup(); }
  renderVals() {
    return {
      subscribed: this.state.sub, notSubscribed: !this.state.sub,
      // TODO: send to newsletter provider
      submit: e => { e.preventDefault(); this.setState({ sub: true }); },
      posts: ['Marketing Is More Than Reels', "Why Content Isn't a Marketing Strategy", 'How We Find Growth Gaps in a Business', 'What AI Actually Changes for Businesses', 'When a Business Should Build Custom Software', 'Brand Trust Is a Growth Asset', 'From Attention to Customers'].map((t, i) => ({ t, n: String(i + 1).padStart(2, '0') }))
    };
  }
}
</script>
</body>
</html>
