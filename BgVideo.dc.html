<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ wrapRef }}" style="position:absolute;inset:0;overflow:hidden;background:#000">
<video ref="{{ vidRef }}" poster="{{ poster }}" preload="metadata" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;object-fit:{{ fit }};object-position:{{ position }};filter:{{ filter }};opacity:{{ opacity }};transition:filter .8s ease, opacity 1.2s ease"></video>
<sc-if value="{{ duo }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:hsl(272 85% 62%);mix-blend-mode:color;opacity:{{ tint }};pointer-events:none"></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:360},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/video/hf_20260325_125119_8e5ae31c-0021-4396-bc08-f7aebeb877a2.mp4&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hls&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;poster&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;treatment&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;duotone&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;'none'|'duotone'&quot;},&quot;tint&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:0.6,&quot;step&quot;:0.01,&quot;default&quot;:0.18,&quot;tsType&quot;:&quot;number&quot;},&quot;fit&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cover&quot;,&quot;contain&quot;],&quot;default&quot;:&quot;cover&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;position&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;50% 50%&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eager&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { playing: false, life: false };
  vidRef = React.createRef();
  wrapRef = React.createRef();
  loadHls() {
    if (window.Hls) return Promise.resolve(window.Hls);
    if (!window.__hzHls) window.__hzHls = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js';
      s.onload = () => res(window.Hls); s.onerror = rej;
      document.head.appendChild(s);
    });
    return window.__hzHls;
  }
  attach() {
    if (this.attached) return;
    this.attached = true;
    const v = this.vidRef.current, src = this.props.src;
    if (!v || !src) return;
    if (this.props.hls) {
      this.loadHls().then(H => {
        if (H && H.isSupported()) {
          this.h = new H({ capLevelToPlayerSize: true, maxBufferLength: 12 });
          this.h.loadSource(src); this.h.attachMedia(v);
          this.h.on(H.Events.MANIFEST_PARSED, () => { if (this.visible) this.play(); });
        } else v.src = src;
      }).catch(() => { v.src = src; });
    } else v.src = src;
  }
  play() { const v = this.vidRef.current; if (!v) return; const p = v.play(); if (p && p.catch) p.catch(() => {}); }
  componentDidMount() {
    const v = this.vidRef.current; if (!v) return;
    v.muted = true; v.defaultMuted = true; v.loop = true; v.playsInline = true;
    v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
    this.onPlaying = () => this.setState({ playing: true });
    v.addEventListener('playing', this.onPlaying);
    if ((window.HZ_HONOR_REDUCED_MOTION===true&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
    if (this.props.eager) this.attach();
    if (!('IntersectionObserver' in window)) { this.attach(); this.play(); return; }
    this.near = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) this.attach(); }), { rootMargin: '100% 0px' });
    this.vis = new IntersectionObserver(es => es.forEach(e => {
      this.visible = e.isIntersecting;
      if (e.isIntersecting) { this.attach(); this.play(); } else v.pause();
    }), { threshold: 0.1 });
    this.near.observe(this.wrapRef.current); this.vis.observe(this.wrapRef.current);
    const host = this.wrapRef.current.closest('[data-life]');
    if (host && window.matchMedia('(hover: hover)').matches) {
      this.enter = () => this.setState({ life: true }); this.leave = () => this.setState({ life: false });
      host.addEventListener('mouseenter', this.enter); host.addEventListener('mouseleave', this.leave); this.host = host;
    }
  }
  componentWillUnmount() {
    this.near && this.near.disconnect(); this.vis && this.vis.disconnect();
    this.h && this.h.destroy();
    if (this.host) { this.host.removeEventListener('mouseenter', this.enter); this.host.removeEventListener('mouseleave', this.leave); }
  }
  posterFor() {
    if (this.props.poster) return this.props.poster;
    const m = /\/(hf_[\w-]+)\.mp4$/.exec(this.props.src || '');
    return m ? 'assets/posters/' + m[1] + '.jpg' : undefined;
  }
  renderVals() {
    const t = this.props.treatment || 'none';
    const duo = t === 'duotone';
    return {
      wrapRef: this.wrapRef, vidRef: this.vidRef,
      poster: this.posterFor(),
      fit: this.props.fit || 'cover',
      position: this.props.position || '50% 50%',
      duo, tint: this.props.tint ?? 0.18,
      filter: duo ? `grayscale(${this.state.life ? 0.4 : 1}) contrast(1.1) brightness(.85)` : 'none',
      opacity: (this.posterFor() || this.state.playing) ? 1 : 0
    };
  }
}
</script>
</body>
</html>
