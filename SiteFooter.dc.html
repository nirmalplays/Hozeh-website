<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:700}}">
class Component extends DCLogic {
  componentDidMount() {
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches || (window.HZ_HONOR_REDUCED_MOTION===true&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
    let mx = -9999, my = -9999, raf = 0, near = false;
    const row = document.querySelector('[data-pressure]');
    if (row && 'IntersectionObserver' in window) { this.pio = new IntersectionObserver(es => { near = es[0].isIntersecting; }); this.pio.observe(row); } else near = true;
    const upd = () => {
      raf = 0;
      if (!near) return;
      document.querySelectorAll('[data-pressure] span').forEach(l => {
        const r = l.getBoundingClientRect();
        const d = Math.hypot(mx - (r.left + r.width / 2), my - (r.top + r.height / 2));
        const k = Math.max(0, Math.min(1, 1 - d / 650));
        l.style.fontVariationSettings = `'wght' ${Math.round(200 + k * 800)}, 'wdth' ${Math.round(70 + k * 81)}`;
      });
    };
    this.onM = e => { mx = e.clientX; my = e.clientY; if (near && !raf) raf = requestAnimationFrame(upd); };
    window.addEventListener('mousemove', this.onM, { passive: true });
  }
  componentWillUnmount() { window.removeEventListener('mousemove', this.onM); this.pio && this.pio.disconnect(); }
  renderVals() { return {}; }
}
</script>
